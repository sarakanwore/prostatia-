[tool.poetry]
name = "stats_engine"
version = "1.0.0"
description = "STATIA Stats Engine - Deterministic mathematical computation service"
authors = ["STATIA Team <team@statia.io>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.6.0"
scipy = "^1.12.0"
statsmodels = "^0.14.1"
scikit-learn = "^1.4.0"

xgboost = "^2.0.3"

seaborn = "^0.13.2"
matplotlib = "^3.8.2"
umap-learn = "^0.5.6"
numpy = "^1.26.3"
pandas = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.26.0"
black = "^24.1.1"
ruff = "^0.2.1"
mypy = "^1.8.0"
pytest-cov = "^4.1"
mkdocs = "^1.5"
mkdocs-material = "^9.5"
mkdocstrings = {version = "^0.24.0", extras = ["python"]}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
