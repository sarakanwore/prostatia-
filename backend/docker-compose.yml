version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: prostatia_user
      POSTGRES_PASSWORD: prostatia_password
      POSTGRES_DB: prostatia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prostatia_user -d prostatia_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  stats_engine:
    image: prostatia/stats-engine:1.0.0
    build:
      context: ./stats_engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SQL_CONNECTION_STRING=postgresql://prostatia_user:prostatia_password@db:5432/prostatia_db
      - MONGODB_URI=mongodb://localhost:27017
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  data_service:
    image: prostatia/data-service:1.0.0
    build:
      context: ./data_service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DATABASE_URL=postgres://prostatia_user:prostatia_password@db:5432/prostatia_db
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai_orchestrator:
    image: prostatia/ai-orchestrator:1.0.0
    build:
      context: ./ai_orchestrator
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DATA_SERVICE_URL=http://data_service:8001/api/v1
      - STATS_ENGINE_URL=http://stats_engine:8000/api/v1
      - DATABASE_URL=postgres://prostatia_user:prostatia_password@db:5432/prostatia_db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  viz_service:
    image: prostatia/viz-service:1.0.0
    build:
      context: ./viz_service
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  geo_service:
    image: prostatia/geo-service:1.0.0
    build:
      context: ./geo_service
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: prostatia/gateway:1.0.0
    build:
      context: ./gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8002
      - DATA_SERVICE_URL=http://data_service:8001
      - STATS_ENGINE_URL=http://stats_engine:8000
      - VIZ_SERVICE_URL=http://viz_service:8003
      - GEO_SERVICE_URL=http://geo_service:8004
      - DATABASE_URL=postgres://prostatia_user:prostatia_password@db:5432/prostatia_db
    depends_on:
      db:
        condition: service_healthy
      stats_engine:
        condition: service_started
      data_service:
        condition: service_started
      ai_orchestrator:
        condition: service_started
      viz_service:
        condition: service_started
      geo_service:
        condition: service_started

volumes:
  postgres_data:
