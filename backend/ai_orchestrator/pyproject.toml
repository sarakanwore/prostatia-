[tool.poetry]
name = "ai_orchestrator"
version = "1.0.0"
description = "STATIA AI Orchestrator - Translates natural language to rigid execution plans"
authors = ["STATIA Team <team@statia.io>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.6.0"
openai = "^1.12.0"
httpx = "^0.26.0"
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
greenlet = "^3.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
    pytest-cov = "^5.0.0"
black = "^24.1.1"
ruff = "^0.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
