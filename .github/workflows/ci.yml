name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-python:
    name: Lint Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [stats_engine, ai_orchestrator, viz_service, geo_service]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run ruff lint
        run: poetry run ruff check .
        continue-on-error: true

      - name: Run black check
        run: poetry run black --check .
        continue-on-error: true

  lint-rust:
    name: Lint Rust (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [data_service, gateway]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt check
        run: cargo fmt -- --check

      - name: Cargo clippy
        run: cargo clippy -- -D warnings
        continue-on-error: true

  test-python:
    name: Test & Coverage Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint-python
    strategy:
      matrix:
        service: [stats_engine, ai_orchestrator, viz_service, geo_service]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run pytest with coverage
        run: |
          poetry run pytest -v --cov=app --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.service }}
          path: backend/${{ matrix.service }}/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: backend/${{ matrix.service }}/coverage.xml
          fail_ci_if_error: false

  test-rust:
    name: Test Rust (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint-rust
    strategy:
      matrix:
        service: [data_service, gateway]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        run: cargo test --all

  docs:
    name: Build Documentation (MkDocs)
    runs-on: ubuntu-latest
    needs: [test-python, test-rust]
    defaults:
      run:
        working-directory: backend/stats_engine
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies (with mkdocs)
        run: poetry install --with dev

      - name: Build MkDocs site
        run: poetry run mkdocs build

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-static-site
          path: backend/stats_engine/site/

  build-frontend:
    name: Build Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build bundle
        run: npm run build

  docker-build:
    name: Docker Compose Build (dry-run)
    runs-on: ubuntu-latest
    needs: [docs, build-frontend]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images (dry-run)
        run: |
          docker compose -f docker-compose.yml build --no-cache
